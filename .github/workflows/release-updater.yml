name: Release AKRX - Addon Manager

on:
  push:
    tags:
      - "v*"
      - "updater-v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag de release a creer/mettre a jour, ex: updater-v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package portable updater
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name || github.ref }}

      - name: Resolve release tag
        id: release_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag_name="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "release" ]; then
            tag_name="$RELEASE_TAG"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag_name" =~ ^(updater-)?v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/AKRX-Addon-Manager

          # Package only the player build, never source files or old executables.
          files=(
            "AKRX - Addon Manager.exe"
            "AKRX - Addon Manager.dll"
            "AKRX - Addon Manager.deps.json"
            "AKRX - Addon Manager.runtimeconfig.json"
            "Lancer AKRX - Addon Manager.cmd"
            "README.txt"
          )
          for file in "${files[@]}"; do
            test -f "$file"
            cp -- "$file" dist/AKRX-Addon-Manager/
          done

          cd dist
          zip -r AKRX-Addon-Manager.zip AKRX-Addon-Manager

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/AKRX-Addon-Manager.zip --clobber
          else
            gh release create "$TAG_NAME" dist/AKRX-Addon-Manager.zip \
              --title "AKRX - Addon Manager $TAG_NAME" \
              --notes "Interface AKRX avec fond illustre, bibliotheque multi-addons GitHub, mises a jour groupees, reparation et sauvegardes. Telechargez AKRX-Addon-Manager.zip, extrayez-le et lancez le fichier CMD : il verifie .NET 10 Desktop Runtime x64."
          fi
