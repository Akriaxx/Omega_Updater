name: Release Omega Hub Updater

on:
  push:
    tags:
      - "v*"
      - "updater-v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag de release a creer/mettre a jour, ex: updater-v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package portable updater
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag_name="${{ github.event.release.tag_name }}"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi

          if [ -z "$tag_name" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/OmegaHubUpdater

          rsync -a \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "dist" \
            --exclude "*.zip" \
            ./ dist/OmegaHubUpdater/

          cd dist
          zip -r OmegaHubUpdater.zip OmegaHubUpdater

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/OmegaHubUpdater.zip --clobber
          else
            gh release create "$TAG_NAME" dist/OmegaHubUpdater.zip \
              --title "Omega Hub Updater $TAG_NAME" \
              --notes "Release $TAG_NAME"
          fi
