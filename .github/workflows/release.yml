name: Release AKRX World Manager

# Pousser un tag vX.Y.Z publie la release a partir des fichiers deja construits dans releases/<tag>/
# (installateur .msi, paquet Velopack, portable, flux de mise a jour). Le code source n'est pas dans ce depot.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          dir="releases/$TAG"
          test -f "$dir/releases.win.json" && test -f "$dir/AKRX.AddonManager-win.msi" && test -f "$dir/notes.md"
          files=()
          for f in "$dir"/*; do [ "$(basename "$f")" != notes.md ] && files+=("$f"); done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "AKRX World Manager $TAG" --notes-file "$dir/notes.md" --latest
          fi
